function addB(){var t=document.getElementById("nt").value.trim();if(!t)return;S.books.push({id:Date.now()%1e9,t:t,a:document.getElementById("na").value||"?",p:+document.getElementById("np").value||250,g:PK.g||"Roman",img:PK.img||"",gid:PK.gid||"",c:S.books.length%8,s:document.getElementById("ns").value,st:document.getElementById("nd").value,en:document.getElementById("ne").value,r:{Intrigue:0,Émotion:0,Style:0},one:"",mood:-1,q:[],ost:""});save();close_();render()}
function up(id,k,v){var b=bk(id);if(k.indexOf("r.")==0)b.r[k.slice(2)]=+v;else b[k]=v;save()}
function detail(id){var b=bk(id);SEL=id;
sheet('<div class="row"><div class="bk" style="background:'+COL[b.c%8]+(b.img?' url('+b.img+') center/cover;color:transparent;text-shadow:none':'')+';height:120px;--r:-3deg;margin:0;flex:0 0 80px">'+esc(b.t)+'</div><div style="flex:3"><h2 style="margin:0">'+esc(b.t)+'</h2>'+esc(b.a)+' · '+b.p+' p.</div></div>'+
'<select onchange="up('+id+',\'s\',this.value)">'+Object.keys(STAT).map(function(k){return'<option value="'+k+'"'+(b.s==k?" selected":"")+'>'+STAT[k]+'</option>'}).join("")+'</select>'+
'<div class="row"><input type="date" value="'+b.st+'" onchange="up('+id+',\'st\',this.value)" aria-label="Début"><input type="date" value="'+b.en+'" onchange="up('+id+',\'en\',this.value)" aria-label="Fin"></div>'+
'<div class="card gold" style="--r:-1deg;margin:10px 0"><div class="row"><b style="flex:2;font-size:21px">⭐ Note globale</b><b id="ovv" style="font-size:24px">'+f1(b.ov||0)+'/5</b></div><input type="range" min="0" max="5" step=".5" value="'+(b.ov||0)+'" oninput="ovl(this.value)" onchange="up('+id+',\'ov\',+this.value)"></div><div class="muted">Jauges : ce qui t’a le plus marquée dans ce livre</div>'+Object.keys(b.r).map(function(k){return'<div class="row"><span style="flex:1">'+(IC[k]||"")+k+'</span><input style="flex:2" type="range" min="0" max="5" step=".5" value="'+b.r[k]+'" onchange="up('+id+',\'r.'+k+'\',this.value)"></div>'}).join("")+
'<input placeholder="Une phrase pour résumer…" value="'+esc(b.one)+'" onchange="up('+id+',\'one\',this.value)">'+
'<select onchange="up('+id+',\'mood\',+this.value)"><option value="-1">Humeur post-lecture…</option>'+MOODS.map(function(m,i){return'<option value="'+i+'"'+(b.mood===i?" selected":"")+'>'+m+'</option>'}).join("")+'</select>'+
'<select onchange="up('+id+',\'fmt\',this.value);detail('+id+')"><option value="cassette">📼 Cassette</option><option value="vinyl"'+(b.fmt=="vinyl"?" selected":"")+'>💿 Vinyle</option></select><input placeholder="🎵 Bande originale du livre" value="'+esc(b.ost)+'" onchange="up('+id+',\'ost\',this.value);detail('+id+')">'+(b.ost?(b.fmt=="vinyl"?vinyl(b.ost):cass(b.ost)):"")+
b.q.map(function(q,i){return'<div class="quote" style="--r:'+(i%2?1:-1)+'deg">“'+esc(q.x)+'” <span class="stampbtn">'+esc(q.k)+'</span></div>'}).join("")+
'<div class="row"><input id="qx" placeholder="Ajouter une citation"><select id="qk" style="flex:0 0 120px">'+STAMPS.map(function(s){return"<option>"+s+"</option>"}).join("")+'</select></div><button class="btn sm" onclick="addQ('+id+')">Coller la citation</button> <button class="btn sm" onclick="delB('+id+')" style="background:#f3c0c0">Supprimer</button> <button class="btn sm alt" onclick="close_();render()">Fermer</button>')}
function addQ(id){var x=document.getElementById("qx").value.trim();if(!x)return;bk(id).q.push({x:x,k:document.getElementById("qk").value});save();detail(id)}
function delB(id){S.books=S.books.filter(function(b){return b.id!=id});save();close_();render()}
render();
</script></body></html>
